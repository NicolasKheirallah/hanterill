name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Generate the build-time artifacts (docs-index.json, responsive image
      # sets, og.png) before lint/typecheck/build. Locally `npm run build`
      # triggers `prebuild` via the npm lifecycle, but CI runs tsc first, so
      # the gitignored src/lib/generated/ wouldn't exist yet.
      - run: npm run prebuild
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      # The same one-shot a contributor runs locally; deploy.yml runs it
      # before publishing too, so nothing ships unverified.
      - name: Site gates
        run: npm run gates
