name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # The download panel, the docs version stamp and the changelog page bake the
  # GitHub release data into the exported HTML at build time. Without this, the
  # site keeps advertising whatever release was latest at the previous build.
  release:
    types: [published]
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A release event checks out the tag. The site always builds master, so
          # publishing a release can never roll the deployed site back.
          ref: ${{ github.event_name == 'release' && 'master' || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Resolves the Pages URL and its base path ("" for a user site or custom
      # domain, "/<repo>" for a project site) so the build can prefix links.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
